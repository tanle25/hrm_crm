<!-- ===== HRM Reply Bubble · Bracket Frame Style ===== -->
<!-- Yêu cầu: FontAwesome 6 + font JetBrains Mono đã load trong app HRM của bạn -->

<div class="reply-msg">
    <!-- Avatar -->
    <div class="reply-msg__avatar">
        <i class="fa-solid fa-user"></i>
    </div>

    <!-- Content area -->
    <div class="reply-msg__body">

        <!-- Quote frame: ảnh gốc bạn đã gửi -->
        <div class="reply-msg__quote">
            <span class="reply-msg__corner reply-msg__corner--tl"></span>
            <span class="reply-msg__corner reply-msg__corner--tr"></span>
            <span class="reply-msg__corner reply-msg__corner--bl"></span>
            <span class="reply-msg__corner reply-msg__corner--br"></span>

            <div class="reply-msg__quote-inner">
                <!-- Thumbnail ảnh gốc -->
                <div class="reply-msg__thumb">
                    <img src="https://via.placeholder.com/80/8a7430/f0e0a0?text=" alt="" />
                </div>
                <!-- Quote info -->
                <div class="reply-msg__quote-info">
                    <div class="reply-msg__quote-label">
                        <i class="fa-solid fa-reply"></i> Quote · ảnh của bạn
                    </div>
                    <div class="reply-msg__quote-meta">3 ngày trước</div>
                </div>
            </div>
        </div>

        <!-- Reply content bubble -->
        <div class="reply-msg__bubble">hhsh</div>

        <!-- Metadata: tên + thời gian -->
        <div class="reply-msg__meta">Doan Le · 08:05 · 9/1/2026</div>
    </div>
</div>


<!-- ===== CSS ===== -->
<style>
.reply-msg {
    display: flex;
    gap: 8px;
    max-width: 360px;
    font-family: 'JetBrains Mono', monospace;
}

/* Avatar */
.reply-msg__avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(74, 158, 255, 0.2);
    border: 1px solid #4a9eff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
    color: #4a9eff;
    font-size: 10px;
}

.reply-msg__body {
    flex: 1;
    min-width: 0;
}

/* Quote frame with corner brackets */
.reply-msg__quote {
    position: relative;
    padding: 8px;
    background: rgba(74, 158, 255, 0.04);
    margin-bottom: 4px;
}

.reply-msg__corner {
    position: absolute;
    width: 8px;
    height: 8px;
    pointer-events: none;
}
.reply-msg__corner--tl {
    top: -1px; left: -1px;
    border-top: 1.5px solid #4a9eff;
    border-left: 1.5px solid #4a9eff;
}
.reply-msg__corner--tr {
    top: -1px; right: -1px;
    border-top: 1.5px solid #4a9eff;
    border-right: 1.5px solid #4a9eff;
}
.reply-msg__corner--bl {
    bottom: -1px; left: -1px;
    border-bottom: 1.5px solid #4a9eff;
    border-left: 1.5px solid #4a9eff;
}
.reply-msg__corner--br {
    bottom: -1px; right: -1px;
    border-bottom: 1.5px solid #4a9eff;
    border-right: 1.5px solid #4a9eff;
}

.reply-msg__quote-inner {
    display: flex;
    gap: 8px;
    align-items: center;
}

.reply-msg__thumb {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border: 1px solid rgba(74, 158, 255, 0.4);
    overflow: hidden;
    background: #0a0e14;
}
.reply-msg__thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.reply-msg__quote-info {
    flex: 1;
    min-width: 0;
    line-height: 1.3;
}
.reply-msg__quote-label {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 700;
    color: #4a9eff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.reply-msg__quote-label i {
    font-size: 8px;
    margin-right: 2px;
}
.reply-msg__quote-meta {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 1px;
}

/* Reply bubble */
.reply-msg__bubble {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(0, 240, 255, 0.15);
    padding: 8px 12px;
    color: #fff;
    font-size: 12px;
    line-height: 1.5;
    word-wrap: break-word;
}

/* Metadata */
.reply-msg__meta {
    font-size: 9px;
    color: #5a6878;
    margin-top: 4px;
    padding-left: 2px;
    letter-spacing: 0.5px;
}
</style>
